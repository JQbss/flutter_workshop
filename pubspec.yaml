name: flutter_workshop
description: "Workshop project: an introduction to Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: 3.12.2

dependencies:
  dio: 5.11.1
  flutter:
    sdk: flutter
  flutter_bloc: 9.1.1
  freezed_annotation: 3.1.0
  # 17.x on purpose: go_router 18 requires migrating from flutter/material.dart to material_ui.
  go_router: 17.5.0
  json_annotation: 4.12.0
  retrofit: 4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  build_runner: 2.15.1
  freezed: 3.2.5
  json_serializable: 6.14.1
  retrofit_generator: 10.2.9

flutter:
  uses-material-design: true
